<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>拾流下载器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 390px;
      margin: 0;
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      color: #1a1a1a;
      background: #f5f7fa;
    }
    header {
      background: #2b579a;
      color: #fff;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 14px;
    }
    header span { opacity: 0.85; font-weight: 400; font-size: 11px; display: block; margin-top: 2px; }
    .body { padding: 12px 14px 14px; }
    .status {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 6px;
      background: #fff; border: 1px solid #d0d7e0; margin-bottom: 12px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #c0392b; flex-shrink: 0; }
    .dot.ok { background: #2e9b3a; }
    .section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
      color: #5a6a7a; margin: 4px 0 6px; font-weight: 700;
    }
    #mediaList { margin-bottom: 8px; }
    .empty { font-size: 12px; color: #6b7a89; padding: 10px 4px; }
    .item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 4px; border-top: 1px solid #eef2f6;
    }
    .item:first-child { border-top: none; }
    .kind {
      font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 4px; color: #fff;
    }
    .kind.page { background: #1a7a32; }
    .kind.hls { background: #c0392b; }
    .kind.dash { background: #8e44ad; }
    .kind.file { background: #2b579a; }
    .meta { flex: 1 1 auto; min-width: 0; }
    .name {
      font-size: 12px; font-weight: 600; color: #22303c;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sub { font-size: 11px; color: #6b7a89; }
    /* rich format list */
    .item-block { border-top: 1px solid #eef2f6; padding: 8px 2px; }
    .item-block:first-child { border-top: none; }
    .formats {
      margin-top: 6px; max-height: 240px; overflow-y: auto;
      border: 1px solid #e2e8ef; border-radius: 6px; background: #fff;
    }
    .floading { padding: 9px 10px; font-size: 12px; color: #6b7a89; }
    .fmt {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 9px; border-top: 1px solid #f0f4f8;
    }
    .fmt:first-child { border-top: none; }
    .fmt:hover { background: #f4f8fd; }
    .fq { font-weight: 700; font-size: 12px; color: #22303c; min-width: 66px; }
    .fmeta {
      flex: 1 1 auto; font-size: 11px; color: #6b7a89;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .fmeta .ff { color: #b9770a; }
    .fmeta .fa { color: #1a7a32; }
    .fdl {
      flex: 0 0 auto; min-width: 32px; height: 27px; border: none;
      border-radius: 5px; background: #2b579a; color: #fff; font-size: 13px;
      font-weight: 700; cursor: pointer;
    }
    .fdl:hover { background: #1e3f73; }
    .fdl:disabled { background: #9aa8ba; cursor: default; }
    button.get {
      padding: 6px 10px; border: none; border-radius: 6px;
      background: #2b579a; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    button.get:hover { background: #1e3f73; }
    button.get:disabled { background: #9aa8ba; cursor: default; }
    details.settings { margin-top: 12px; border-top: 1px solid #e2e8ef; padding-top: 8px; }
    details.settings summary { cursor: pointer; color: #2b579a; font-weight: 600; font-size: 12px; }
    label.row { display: flex; align-items: center; gap: 8px; margin: 8px 0; cursor: pointer; }
    label.field {
      display: block; margin: 10px 0 4px; color: #5a6a7a; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    input[type="number"], input[type="text"] {
      width: 100%; padding: 7px 8px; border: 1px solid #b8c4d0; border-radius: 4px; font: inherit;
    }
    .btn-wide {
      width: 100%; margin-top: 10px; padding: 9px; border: none; border-radius: 4px;
      background: #2b579a; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn-wide:hover { background: #1e3f73; }
    .btn-wide.secondary { background: #fff; color: #2b579a; border: 1px solid #2b579a; margin-top: 8px; }
    .hint { color: #5a6a7a; font-size: 11px; margin-top: 10px; }
    code { background: #e8eef5; padding: 1px 4px; border-radius: 3px; }
    .warn { color: #b9770a; font-size: 11px; margin-top: 6px; }
    /* Prominent, not buried in Settings: this is the fix when a download comes
       back as a sign-in page instead of the file. */
    .cookie-row {
      align-items: flex-start; gap: 8px; margin: 0 0 12px;
      padding: 9px 10px; border: 1px solid #d0d7e0; border-radius: 6px;
      background: #fff; font-size: 12px; line-height: 1.35;
    }
    .cookie-row input { margin-top: 2px; flex: 0 0 auto; }
    #pinHint {
      display: none; padding: 10px 14px; background: #fff7e6; color: #7a5b12;
      font-size: 12px; line-height: 1.5; border-bottom: 1px solid #f0e2c0;
    }
    #pinHint b { color: #6b4e0a; }
    #pinHint button {
      margin-top: 7px; padding: 4px 12px; border: none; border-radius: 5px;
      background: #2b579a; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    #pinHint button:hover { background: #1e3f73; }
  </style>
</head>
<body>
  <header>
    拾流下载器 <small id="extVersion"></small>
    <span>视频识别 · 多线程下载</span>
  </header>
  <div id="pinHint">
    📌 <b>建议固定到工具栏：</b>点击浏览器右上角的 <b>🧩</b> 图标，
    再点击 拾流下载器 旁边的图钉。
    <div><button id="pinHintClose" type="button">知道了</button></div>
  </div>
  <div class="body">
    <div class="status">
      <div class="dot" id="dot"></div>
      <div style="flex:1 1 auto; min-width:0">
        <div id="statusText">正在连接软件…</div>
        <div class="hint" id="statusDetail" style="margin:0"></div>
      </div>
      <button class="get" id="recheck" style="background:#eef2f8;color:#2b579a">↻</button>
    </div>

    <label class="row cookie-row" title="仅在下载需要登录时启用">
      <input type="checkbox" id="sendCookies" />
      <span><b>允许使用当前网站的登录信息</b>
        <span class="hint" style="display:block;margin:2px 0 0">仅在你信任此软件、且视频需要登录时开启。</span>
      </span>
    </label>

    <div class="section-title">当前页面的视频</div>
    <div id="mediaList"><div class="empty">正在识别…</div></div>
    <div class="warn" id="ffmpegWarn" style="display:none">
      ⚠ 未检测到 ffmpeg。高清画面和声音可能无法合并为 MP4。请在桌面软件的“选项 → 视频”中安装。
    </div>

    <details class="settings">
      <summary>设置</summary>
      <label class="row"><input type="checkbox" id="enabled" /> 启用扩展</label>
      <label class="row"><input type="checkbox" id="showVideoButton" /> 在视频旁显示下载按钮</label>
      <label class="row"><input type="checkbox" id="showFloatingButton" /> 显示页面悬浮按钮</label>
      <label class="row"><input type="checkbox" id="captureDownloads" /> 接管浏览器普通下载</label>

      <label class="field" for="port">连接端口</label>
      <input type="number" id="port" min="1024" max="65535" />

      <label class="field" for="token">连接口令（可选）</label>
      <input type="text" id="token" placeholder="桌面软件未设置时留空" />

      <button class="btn-wide" id="save">保存设置</button>
      <p class="hint">
        右击链接可选择<strong>使用 拾流下载器 下载</strong>。<br />
        桌面软件需保持运行，连接地址为 <code>127.0.0.1</code>。
      </p>
    </details>
  </div>
  <script src="popup.js"></script>
</body>
</html>
